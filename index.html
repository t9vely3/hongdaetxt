<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#5b4bff">
<title>사내문고</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@300;400;500;600;700&family=Hahmlet:wght@500;600;700&family=Gowun+Batang:wght@400;700&display=swap');

:root{
  --bg:#ffffff;
  --bg-soft:#f4f5f7;
  --surface:#ffffff;
  --surface-2:#fafbfc;
  --line:#e6e8ec;
  --line-soft:#f0f1f4;
  --tx:#17181c;
  --tx-2:#5b6070;
  --tx-3:#9aa0ae;
  --accent:#5b4bff;
  --accent-soft:#eeecff;
  --accent-tx:#4d3ce8;
  --gold:#e8a020;
  --danger:#e0453a;
  --shadow:0 1px 2px rgba(20,22,30,.06),0 8px 24px rgba(20,22,30,.06);
  --shadow-lg:0 12px 40px rgba(20,22,30,.14);
  --radius:14px;
  --font:'IBM Plex Sans KR','Apple SD Gothic Neo','Pretendard','Malgun Gothic',-apple-system,BlinkMacSystemFont,sans-serif;
  --font-disp:'Hahmlet','IBM Plex Sans KR','Apple SD Gothic Neo',serif;
  --font-read:'Gowun Batang','Nanum Myeongjo',serif;
  --hdr-h:60px;
  --maxw:1200px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0e0e12;
    --bg-soft:#131319;
    --surface:#17171e;
    --surface-2:#1c1c24;
    --line:#2a2a35;
    --line-soft:#22222c;
    --tx:#ecedf2;
    --tx-2:#a2a6b5;
    --tx-3:#71768a;
    --accent:#8878ff;
    --accent-soft:#241f4d;
    --accent-tx:#a99cff;
    --gold:#f0b33c;
    --danger:#ff6a5e;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35);
    --shadow-lg:0 14px 44px rgba(0,0,0,.55);
  }
}
:root[data-theme="dark"]{
  --bg:#0e0e12;
  --bg-soft:#131319;
  --surface:#17171e;
  --surface-2:#1c1c24;
  --line:#2a2a35;
  --line-soft:#22222c;
  --tx:#ecedf2;
  --tx-2:#a2a6b5;
  --tx-3:#71768a;
  --accent:#8878ff;
  --accent-soft:#241f4d;
  --accent-tx:#a99cff;
  --gold:#f0b33c;
  --danger:#ff6a5e;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35);
  --shadow-lg:0 14px 44px rgba(0,0,0,.55);
}

*{box-sizing:border-box}
body{
  margin:0;background:var(--bg);color:var(--tx);
  font-family:var(--font);
  font-size:15px;line-height:1.65;-webkit-font-smoothing:antialiased;
  text-rendering:optimizeLegibility;word-break:keep-all;
}
a{color:inherit;text-decoration:none}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
img{max-width:100%;display:block}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:var(--line);border-radius:8px;border:3px solid var(--bg)}
.wrap{max-width:var(--maxw);margin:0 auto;padding:0 20px}

/* ── header ───────────────────────────────── */
.hdr{position:sticky;top:0;z-index:60;background:var(--bg);border-bottom:1px solid var(--line)}
.hdr-in{max-width:var(--maxw);margin:0 auto;padding:0 20px;height:var(--hdr-h);display:flex;align-items:center;gap:22px}
.logo{display:flex;align-items:center;gap:9px;font-family:var(--font-disp);font-weight:700;font-size:19.5px;letter-spacing:-.045em;white-space:nowrap}
.logo-mark{width:30px;height:30px;border-radius:10px;background:linear-gradient(140deg,var(--accent),#b06bff);display:grid;place-items:center;flex:none;box-shadow:0 2px 8px rgba(91,75,255,.32)}
.logo:hover .logo-mark{transform:rotate(-6deg) scale(1.05);transition:.2s}
.gnb{display:flex;align-items:center;gap:4px;flex:1;min-width:0}
.gnb-scroll{display:flex;gap:2px;flex:1;min-width:0;overflow-x:auto;scrollbar-width:none;padding-right:8px;-webkit-mask-image:linear-gradient(to right,#000 calc(100% - 22px),transparent);mask-image:linear-gradient(to right,#000 calc(100% - 22px),transparent)}
.gnb-scroll::-webkit-scrollbar{display:none}
.gnb button{padding:7px 12px;border-radius:9px;color:var(--tx-2);font-weight:500;white-space:nowrap;font-size:14.5px}
.gnb button:hover{background:var(--bg-soft);color:var(--tx)}
.gnb button.on{color:var(--accent-tx);background:var(--accent-soft);font-weight:600}
.gnb .gear{flex:none;color:var(--tx-3);font-size:12.5px;padding:6px 10px;border:1px dashed var(--line);border-radius:9px}
.gnb .gear:hover{color:var(--accent-tx);border-color:var(--accent);background:var(--accent-soft)}
.cat-row{display:flex;align-items:center;gap:6px;margin-bottom:8px}
.cat-row input{flex:1}
.cat-row button{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;color:var(--tx-3);border:1px solid var(--line)}
.cat-row button:hover{color:var(--tx);border-color:var(--tx-3)}
.hdr-act{display:flex;align-items:center;gap:8px;margin-left:auto}
.searchbox{display:flex;align-items:center;gap:7px;background:var(--bg-soft);border:1px solid transparent;border-radius:10px;padding:7px 12px;width:210px;transition:.15s}
.searchbox:focus-within{border-color:var(--accent);background:var(--surface)}
.searchbox input{border:0;background:none;outline:none;width:100%;font-size:14px}
.searchbox svg{flex:none;color:var(--tx-3)}
.conn{width:30px;height:36px;display:grid;place-items:center;flex:none}
.conn i{width:8px;height:8px;border-radius:50%;background:var(--tx-3);box-shadow:0 0 0 3px var(--bg-soft);transition:.2s}
.conn:hover i{transform:scale(1.25)}
.icobtn{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;color:var(--tx-2)}
.icobtn:hover{background:var(--bg-soft);color:var(--tx)}
.icobtn.mark.on{color:var(--accent-tx)}
.icobtn.mark.on svg{fill:currentColor}
.kakao{background:#3b1e1e;color:#ffe08a;font-size:13px;text-align:center;padding:10px 16px;line-height:1.6}
.kakao button{margin-left:8px;background:#ffe08a;color:#3b1e1e;font-weight:800;padding:5px 12px;border-radius:8px;font-size:12.5px}
.mk-row{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line-soft);cursor:pointer}
.mk-row:last-child{border-bottom:0}
.mk-row .pct{width:34px;flex:none;text-align:center;font-size:11.5px;font-weight:800;color:var(--accent-tx);font-variant-numeric:tabular-nums}
.mk-row .bd{min-width:0;flex:1}
.mk-row .t1{font-size:13.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mk-row .t2{font-size:11.5px;color:var(--tx-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
.mk-row .x{width:24px;height:24px;border-radius:6px;color:var(--tx-3);flex:none}
.mk-row .x:hover{background:var(--bg-soft);color:var(--danger)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:9px 16px;border-radius:10px;font-weight:700;font-size:14px;transition:.15s;white-space:nowrap}
.btn-pri{background:var(--accent);color:#fff}
.btn-pri:hover{filter:brightness(1.08)}
.btn-line{border:1px solid var(--line);color:var(--tx-2);background:var(--surface)}
.btn-line:hover{border-color:var(--tx-3);color:var(--tx)}
.btn-soft{background:var(--bg-soft);color:var(--tx-2)}
.btn-soft:hover{color:var(--tx)}
.btn-danger{color:var(--danger);border:1px solid var(--line)}
.btn-danger:hover{background:var(--danger);color:#fff;border-color:var(--danger)}
.btn-lg{padding:13px 24px;font-size:15px;border-radius:12px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.who{display:flex;align-items:center;gap:7px;padding:6px 11px 6px 6px;border-radius:999px;background:var(--bg-soft);font-size:13.5px;font-weight:600;color:var(--tx-2)}
.who:hover{color:var(--tx)}
.ava{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;color:#fff;font-size:11px;font-weight:800;flex:none}

/* ── home hero ────────────────────────────── */
.hero{position:relative;border-radius:20px;overflow:hidden;margin:26px 0 34px;min-height:280px;background:var(--surface-2);border:1px solid var(--line)}
.hero-bg{position:absolute;inset:0;background-size:cover;background-position:center;filter:blur(28px) saturate(1.4);transform:scale(1.25);opacity:.55}
.hero-veil{position:absolute;inset:0;background:linear-gradient(100deg,rgba(10,10,16,.88) 0%,rgba(10,10,16,.68) 46%,rgba(10,10,16,.32) 100%)}
.hero-in{position:relative;display:flex;gap:30px;align-items:center;padding:34px 38px;color:#fff}
.hero-cover{width:150px;flex:none;aspect-ratio:3/4;border-radius:12px;overflow:hidden;box-shadow:0 14px 34px rgba(0,0,0,.45)}
.hero-txt{min-width:0}
.hero-badge{display:inline-flex;align-items:center;gap:6px;background:rgba(255,255,255,.16);backdrop-filter:blur(6px);padding:5px 11px;border-radius:999px;font-size:12px;font-weight:700;letter-spacing:.02em}
.hero-title{font-family:var(--font-disp);font-size:32px;font-weight:700;letter-spacing:-.045em;margin:13px 0 8px;line-height:1.28;text-wrap:balance}
.hero-meta{font-size:13.5px;opacity:.82;margin-bottom:11px}
.hero-sum{font-size:14.5px;opacity:.9;line-height:1.68;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;max-width:640px}
.hero-btns{display:flex;gap:9px;margin-top:19px}
.hero-btns .btn-line{background:rgba(255,255,255,.14);border-color:rgba(255,255,255,.3);color:#fff}
.hero-btns .btn-line:hover{background:rgba(255,255,255,.24);color:#fff}
.hero-dots{position:absolute;right:24px;bottom:20px;display:flex;gap:6px;z-index:2}
.hero-dots button{width:7px;height:7px;border-radius:50%;background:rgba(255,255,255,.38)}
.hero-dots button.on{background:#fff;width:20px;border-radius:4px}

/* ── layout ───────────────────────────────── */
.cols{display:grid;grid-template-columns:minmax(0,1fr) 310px;gap:36px;align-items:start;padding-bottom:70px}
.sec{margin-bottom:40px}
.sec-hd{display:flex;align-items:flex-end;gap:10px;margin-bottom:16px}
.sec-hd h2{font-family:var(--font-disp);font-size:20px;font-weight:700;letter-spacing:-.04em;margin:0}
.sec-hd .sub{font-size:13px;color:var(--tx-3);margin-bottom:2px}
.sec-hd .right{margin-left:auto;display:flex;gap:6px;align-items:center}
select.mini{border:1px solid var(--line);background:var(--surface);border-radius:9px;padding:7px 10px;font-size:13.5px;color:var(--tx-2);outline:none}

/* ── grid cards ───────────────────────────── */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(148px,1fr));gap:22px 18px}
.card{cursor:pointer}
.card-cv{position:relative;aspect-ratio:3/4;border-radius:12px;overflow:hidden;background:var(--bg-soft);box-shadow:var(--shadow);transition:.2s}
.card:hover .card-cv{transform:translateY(-4px);box-shadow:var(--shadow-lg)}
.card-cv img{width:100%;height:100%;object-fit:cover}
.cv-gen{width:100%;height:100%;display:flex;flex-direction:column;justify-content:flex-end;padding:14px;color:#fff}
.cv-gen b{font-family:var(--font-disp);font-size:16px;font-weight:700;letter-spacing:-.04em;line-height:1.35;text-shadow:0 2px 10px rgba(0,0,0,.35);display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.cv-gen span{font-size:11px;opacity:.8;margin-top:5px}
.cv-tag{position:absolute;top:8px;left:8px;background:rgba(0,0,0,.6);backdrop-filter:blur(4px);color:#fff;font-size:11px;font-weight:700;padding:3px 8px;border-radius:6px}
.cv-up{position:absolute;top:8px;right:8px;background:var(--accent);color:#fff;font-size:10.5px;font-weight:800;padding:3px 7px;border-radius:6px}
.card-tt{font-size:14px;font-weight:600;letter-spacing:-.02em;margin-top:10px;line-height:1.4;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card-mt{font-size:12px;color:var(--tx-3);margin-top:4px;display:flex;gap:6px;flex-wrap:wrap}

/* ── ranking ──────────────────────────────── */
.side{position:sticky;top:calc(var(--hdr-h) + 22px)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:18px 18px 8px}
.panel + .panel{margin-top:18px}
.panel-hd{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.panel-hd h3{font-family:var(--font-disp);font-size:16px;font-weight:700;margin:0;letter-spacing:-.035em}
.panel-hd .live{font-size:10.5px;font-weight:800;color:var(--danger);display:flex;align-items:center;gap:4px}
.dot{width:5px;height:5px;border-radius:50%;background:var(--danger);animation:blink 1.6s infinite}
@keyframes blink{50%{opacity:.25}}
.rank-row{display:flex;align-items:center;gap:12px;padding:9px 0;border-bottom:1px solid var(--line-soft);cursor:pointer}
.rank-row:last-child{border-bottom:0}
.rank-row:hover .rank-tt{color:var(--accent-tx)}
.rk{width:20px;text-align:center;font-family:var(--font-disp);font-size:16px;font-weight:700;font-variant-numeric:tabular-nums;color:var(--tx-3);font-style:italic;flex:none}
.rank-row:nth-child(-n+4) .rk{color:var(--gold)}
.rank-cv{width:34px;height:45px;border-radius:6px;overflow:hidden;flex:none;background:var(--bg-soft)}
.rank-cv img{width:100%;height:100%;object-fit:cover}
.rank-cv .cv-gen{padding:4px}
.rank-cv .cv-gen b{font-size:8px;-webkit-line-clamp:2}
.rank-cv .cv-gen span{display:none}
.rank-body{min-width:0;flex:1}
.rank-tt{font-size:13.5px;font-weight:600;letter-spacing:-.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;transition:.15s}
.rank-mt{font-size:11.5px;color:var(--tx-3);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* ── list rows (전체 작품) ─────────────────── */
.chips{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:16px}
.chip{padding:6px 13px;border-radius:999px;border:1px solid var(--line);font-size:13px;font-weight:600;color:var(--tx-2);background:var(--surface)}
.chip.on{background:var(--tx);color:var(--bg);border-color:var(--tx)}
.chip:hover:not(.on){border-color:var(--tx-3)}

/* ── series detail ────────────────────────── */
.sd-top{position:relative;border-radius:20px;overflow:hidden;margin:24px 0 28px;border:1px solid var(--line)}
.sd-in{position:relative;display:flex;gap:28px;padding:32px 34px;color:#fff}
.sd-cover{position:relative;width:172px;flex:none;aspect-ratio:3/4;border-radius:12px;overflow:hidden;box-shadow:0 14px 34px rgba(0,0,0,.45)}
.sd-cover.editable{cursor:pointer}
.cv-edit{position:absolute;left:0;right:0;bottom:0;padding:9px;text-align:center;font-size:12px;font-weight:700;
  background:rgba(10,10,16,.72);color:#fff;opacity:0;transition:.18s}
.sd-cover.editable:hover .cv-edit{opacity:1}
@media (hover:none){ .cv-edit{opacity:1} }
.sd-info{min-width:0;flex:1;display:flex;flex-direction:column}
.sd-cat{font-size:12.5px;font-weight:700;opacity:.85}
.sd-title{font-family:var(--font-disp);font-size:29px;font-weight:700;letter-spacing:-.045em;margin:8px 0 10px;line-height:1.3;text-wrap:balance}
.sd-by{font-size:14px;opacity:.88}
.sd-stats{display:flex;gap:22px;margin:18px 0 14px;padding:14px 0;border-top:1px solid rgba(255,255,255,.16);border-bottom:1px solid rgba(255,255,255,.16)}
.sd-stat b{display:block;font-size:17.5px;font-weight:700;font-variant-numeric:tabular-nums}
.sd-stat span{font-size:11.5px;opacity:.7}
.sd-tags{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px}
.sd-tags span{background:rgba(255,255,255,.16);padding:4px 10px;border-radius:999px;font-size:12px}
.sd-btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:auto}
.sd-btns .btn-line{background:rgba(255,255,255,.14);border-color:rgba(255,255,255,.28);color:#fff}
.sd-btns .btn-line:hover{background:rgba(255,255,255,.24)}
.sd-sum{white-space:pre-wrap;color:var(--tx-2);font-size:14.5px;line-height:1.8;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:20px 22px;margin-bottom:28px}
.ep-hd{display:flex;align-items:center;gap:10px;margin-bottom:6px}
.ep-hd h3{font-family:var(--font-disp);font-size:18px;font-weight:700;margin:0;letter-spacing:-.035em}
.ep-hd .cnt{color:var(--accent-tx);font-weight:800}
.ep-list{border-top:1px solid var(--line)}
.ep-row{display:flex;align-items:center;gap:14px;padding:15px 6px;border-bottom:1px solid var(--line-soft);cursor:pointer;transition:.12s}
.ep-row:hover{background:var(--bg-soft)}
.ep-no{width:52px;flex:none;text-align:center;font-size:13px;font-weight:800;color:var(--tx-3)}
.ep-body{flex:1;min-width:0}
.ep-tt{font-size:15px;font-weight:500;letter-spacing:-.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ep-mt{font-size:12px;color:var(--tx-3);margin-top:3px}
.ep-read{font-size:11px;font-weight:700;color:var(--accent-tx);background:var(--accent-soft);padding:2px 7px;border-radius:5px;margin-left:6px}
.ep-act{display:flex;gap:4px;opacity:0;transition:.15s}
.ep-row:hover .ep-act{opacity:1}
.ep-act button{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;color:var(--tx-3)}
.ep-act button:hover{background:var(--surface);color:var(--tx);box-shadow:var(--shadow)}

/* ── reader ───────────────────────────────── */
.reader{position:fixed;inset:0;z-index:200;background:var(--bg);overflow-y:auto;display:none}
.reader.on{display:block}
.rd-bar{position:fixed;top:0;left:0;right:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line);
  height:54px;display:flex;align-items:center;gap:12px;padding:0 18px;transition:transform .22s,opacity .22s}
.rd-foot{position:fixed;left:0;right:0;bottom:0;z-index:5;background:var(--bg);border-top:1px solid var(--line);
  height:56px;display:flex;align-items:stretch;transition:transform .22s,opacity .22s;
  padding-bottom:env(safe-area-inset-bottom)}
.rd-foot button{flex:1;font-size:14px;font-weight:700;color:var(--tx-2)}
.rd-foot #fNext{color:var(--accent-tx)}
.rd-foot button:hover:not(:disabled){background:var(--bg-soft);color:var(--tx)}
.rd-foot button:disabled{opacity:.35;cursor:default}
.rd-foot button + button{border-left:1px solid var(--line-soft)}
.reader.ui-off .rd-bar{transform:translateY(-100%);opacity:0}
.reader.ui-off .rd-foot{transform:translateY(100%);opacity:0}
.reader.ui-off .rd-set{transform:translateX(100%)}
.rd-body{cursor:pointer}
.rd-bar .tt{font-size:14px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1;min-width:0}
.rd-prog{position:fixed;top:0;left:0;height:3px;background:var(--accent);z-index:210;transition:width .1s}
.rd-wrap{max-width:var(--rd-w,720px);margin:0 auto;padding:100px 24px 140px}
.rd-ep-no{font-size:13px;font-weight:700;color:var(--accent-tx);letter-spacing:.04em}
.rd-tt{font-family:var(--font-disp);font-size:27px;font-weight:700;letter-spacing:-.04em;margin:10px 0 8px;line-height:1.4;text-wrap:balance}
.rd-mt{font-size:13px;color:var(--tx-3);padding-bottom:26px;border-bottom:1px solid var(--line);margin-bottom:34px}
.rd-body{white-space:pre-wrap;word-break:break-word;font-size:var(--rd-fs,17px);line-height:var(--rd-lh,2);letter-spacing:-.01em;color:var(--tx)}
.rd-body.serif{font-family:var(--font-read)}
.rd-nav{display:flex;gap:10px;margin-top:60px;padding-top:26px;border-top:1px solid var(--line)}
.rd-nav .btn{flex:1}
.rd-set{position:fixed;right:0;top:54px;bottom:0;width:290px;background:var(--surface);border-left:1px solid var(--line);padding:22px;transform:translateX(100%);transition:.22s;z-index:6;overflow-y:auto}
.rd-set.on{transform:none;box-shadow:var(--shadow-lg)}
.set-row{margin-bottom:22px}
.set-row label{display:block;font-size:12.5px;font-weight:700;color:var(--tx-3);margin-bottom:9px}
.seg{display:flex;gap:5px}
.seg button{flex:1;padding:8px 0;border:1px solid var(--line);border-radius:9px;font-size:13px;font-weight:600;color:var(--tx-2);background:var(--surface)}
.seg button.on{background:var(--accent);border-color:var(--accent);color:#fff}
input[type=range]{width:100%;accent-color:var(--accent)}

.toast.on{opacity:1;transform:translate(-50%,0)}

.fab{position:fixed;right:24px;bottom:24px;z-index:50;box-shadow:var(--shadow-lg);display:none}

const esc = s => String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

const now = () => Date.now();

function ago(ts){
  if(!ts) return '';
  const d = (now()-ts)/1000;
  if(d<60) return '방금';
  if(d<3600) return Math.floor(d/60)+'분 전';
  if(d<86400) return Math.floor(d/3600)+'시간 전';
  if(d<86400*7) return Math.floor(d/86400)+'일 전';
  const t = new Date(ts);
  return `${t.getFullYear()}.${String(t.getMonth()+1).padStart(2,'0')}.${String(t.getDate()).padStart(2,'0')}`;
}
function isNew(ts){ return ts && now()-ts < 86400*1000*3; }
function hashN(str,mod){ let h=0; for(let i=0;i<String(str).length;i++) h=(h*31+String(str).charCodeAt(i))|0; return Math.abs(h)%mod; }

const LS = {
  get(k,d){ try{ const v=localStorage.getItem(k); return v==null?d:JSON.parse(v); }catch(e){ return d; } },
  set(k,v){ try{ localStorage.setItem(k,JSON.stringify(v)); }catch(e){} }
};

/* ══════════════════════════════════════════════════
   2. 저장소 (Firestore ↔ localStorage 폴백)
   ══════════════════════════════════════════════════ */
const Store = {
  mode:'local', why:null, whyMsg:'', db:null, _subs:[], _epSubs:{},
  init(){
    // 변수 이름을 다르게 붙여 넣은 경우까지 받아 준다
    let cfg = window.FIREBASE_CONFIG || window.firebaseConfig || null;
    if(!cfg){ try{ cfg = firebaseConfig; }catch(e){} }
    if(cfg && !window.FIREBASE_CONFIG) window.FIREBASE_CONFIG = cfg;

    if(!cfg || !cfg.apiKey || !cfg.projectId){
      this.why = 'no-config'; return this.mode;
    }
    if(/여기에/.test(String(cfg.apiKey)+' '+String(cfg.projectId))){
      this.why = 'placeholder'; return this.mode;
    }
    if(!window.firebase || !firebase.firestore){
      this.why = 'no-sdk'; return this.mode;
    }
    try{
      if(!firebase.apps.length) firebase.initializeApp(cfg);
      this.db = firebase.firestore();
      this.mode = 'cloud'; this.why = null;
    }catch(e){
      console.error('Firebase 초기화 실패', e);
      this.why = 'init-failed'; this.whyMsg = e.message||'';
    }
    return this.mode;
  },
  /* --- local 저장 --- */
  _local(){ return LS.get(LSK, {series:{}, eps:{}}); },
  _saveLocal(d){ LS.set(LSK, d); },

  /* --- 시리즈 구독 --- */
  onSeries(cb){
    if(this.mode==='cloud'){
      this.db.collection('novel_series').onSnapshot(snap=>{
        S.conn.ok=true; S.conn.err=null; S.conn.lastSync=now(); renderConn();
        cb(snap.docs.map(d=>Object.assign({id:d.id}, d.data())));
      }, err=>{
        console.error(err);
        S.conn.ok=false; S.conn.err=(err.code||'')+' '+(err.message||''); renderConn();
        toast('데이터를 불러오지 못했습니다');
      });
    }else{
      this._seriesCb = cb;
      cb(Object.values(this._local().series));
    }
  },
  _pushLocal(){ if(this._seriesCb) this._seriesCb(Object.values(this._local().series)); },

  async saveSeries(obj){
    const id = obj.id || uid();
    const data = Object.assign({}, obj, {id, updatedAt: now()});
    if(!data.createdAt) data.createdAt = now();
    if(this.mode==='cloud'){
      const {id:_, ...body} = data;
      try{ await this.db.collection('novel_series').doc(id).set(body, {merge:true}); }catch(e){ permErr(e); throw e; }
    }else{
      const d=this._local(); d.series[id]=Object.assign(d.series[id]||{}, data); this._saveLocal(d); this._pushLocal();
    }
    return id;
  },
  async delSeries(id){
    if(this.mode==='cloud'){
      const eps = await this.db.collection('novel_series').doc(id).collection('episodes').get();
      await Promise.all(eps.docs.map(d=>d.ref.delete()));
      await this.db.collection('novel_series').doc(id).delete();
    }else{
      const d=this._local(); delete d.series[id]; delete d.eps[id]; this._saveLocal(d); this._pushLocal();
    }
  },

  /* --- 회차 --- */
  watchEpisodes(sid, cb){
    if(this.mode==='cloud'){
      if(this._epSubs[sid]) this._epSubs[sid]();
      this._epSubs[sid] = this.db.collection('novel_series').doc(sid).collection('episodes')
        .onSnapshot(snap=> cb(snap.docs.map(d=>Object.assign({id:d.id}, d.data()))), e=>console.error(e));
    }else{
      this._epCb = this._epCb||{}; this._epCb[sid]=cb;
      cb(Object.values((this._local().eps[sid])||{}));
    }
  },
  _pushEps(sid){ if(this._epCb && this._epCb[sid]) this._epCb[sid](Object.values((this._local().eps[sid])||{})); },

  async getEpisodes(sid){
    if(this.mode==='cloud'){
      const snap = await this.db.collection('novel_series').doc(sid).collection('episodes').get();
      return snap.docs.map(d=>Object.assign({id:d.id}, d.data()));
    }
    return Object.values((this._local().eps[sid])||{});
  },
  async saveEpisode(sid, ep){
    const id = ep.id || uid();
    const data = Object.assign({}, ep, {id, updatedAt: now()});
    if(!data.createdAt) data.createdAt = now();
    data.chars = (data.body||'').length;
    if(this.mode==='cloud'){
      const {id:_, ...body} = data;
      try{ await this.db.collection('novel_series').doc(sid).collection('episodes').doc(id).set(body,{merge:true}); }catch(e){ permErr(e); throw e; }
    }else{
      const d=this._local(); d.eps[sid]=d.eps[sid]||{}; d.eps[sid][id]=Object.assign(d.eps[sid][id]||{}, data);
      this._saveLocal(d); this._pushEps(sid);
    }
    await this.syncSeriesMeta(sid);
    return id;
  },
  async delEpisode(sid, eid){
    if(this.mode==='cloud') await this.db.collection('novel_series').doc(sid).collection('episodes').doc(eid).delete();
    else { const d=this._local(); if(d.eps[sid]) delete d.eps[sid][eid]; this._saveLocal(d); this._pushEps(sid); }
    await this.syncSeriesMeta(sid);
  },
  /* 시리즈 카드에 쓰이는 집계값 갱신 */
  async syncSeriesMeta(sid){
    const eps = await this.getEpisodes(sid);
    const last = eps.reduce((m,e)=>Math.max(m, e.updatedAt||e.createdAt||0), 0);
    await this.saveSeries({id:sid, epCount:eps.length, lastEpAt:last||now()});
  },
  async bumpView(sid, eid){
    if(this.mode==='cloud'){
      const inc = firebase.firestore.FieldValue.increment(1);
      this.db.collection('novel_series').doc(sid).update({views:inc}).catch(()=>{});
      if(eid) this.db.collection('novel_series').doc(sid).collection('episodes').doc(eid).update({views:inc}).catch(()=>{});
    }else{
      const d=this._local();
      if(d.series[sid]) d.series[sid].views=(d.series[sid].views||0)+1;
      if(eid && d.eps[sid] && d.eps[sid][eid]) d.eps[sid][eid].views=(d.eps[sid][eid].views||0)+1;
      this._saveLocal(d); this._pushLocal(); this._pushEps(sid);
    }
  },
  /* --- 인증 --- */
  initAuth(cb){
    if(this.mode!=='cloud' || !window.firebase || !firebase.auth){ cb(null); return; }
    this.auth = firebase.auth();
    this.auth.onAuthStateChanged(u=> cb(u? {
      email:(u.email||'').toLowerCase(), name:u.displayName||u.email, photo:u.photoURL||''
    } : null));
  },
  signIn(){
    if(!this.auth){ toast('로그인을 쓸 수 없는 상태입니다'); return; }
    const pv = new firebase.auth.GoogleAuthProvider();
    this.auth.signInWithPopup(pv).catch(e=>{
      console.error(e);
      toast(e.code==='auth/unauthorized-domain' ? '이 주소가 Firebase 승인된 도메인에 없습니다' : '로그인에 실패했습니다');
    });
  },
  signInEmail(email, pw){
    if(!this.auth) return Promise.reject(new Error('no-auth'));
    return this.auth.signInWithEmailAndPassword(email.trim(), pw);
  },
  resetPw(email){
    if(!this.auth) return Promise.reject(new Error('no-auth'));
    return this.auth.sendPasswordResetEmail(email.trim());
  },
  signOut(){ if(this.auth) this.auth.signOut(); },

  /* --- 작가 명단 --- */
  watchAuthors(cb){
    if(this.mode!=='cloud'){ cb([]); return; }
    this.db.collection('novel_authors').onSnapshot(
      snap=> cb(snap.docs.map(d=>Object.assign({id:d.id}, d.data()))),
      e=>{ console.error(e); cb([]); });
  },
  async updateMe(data){
    if(this.mode!=='cloud' || !S.user) return;
    await this.db.collection('novel_authors').doc(S.user.email).set(data, {merge:true});
  },
  async addAuthor(email, data){
    const id = String(email).trim().toLowerCase();
    await this.db.collection('novel_authors').doc(id)
      .set(Object.assign({email:id, addedAt:now()}, data||{}), {merge:true});
  },
  async delAuthor(email){
    await this.db.collection('novel_authors').doc(String(email).toLowerCase()).delete();
  },

  async touchReader(name){
    if(this.mode!=='cloud') return;
    const nm = String(name||'').trim().slice(0,20);
    if(!nm) return;
    try{
      await this.db.collection('novel_readers').doc(Me.did)
        .set({name:nm, lastSeen:now()}, {merge:true});
    }catch(e){ /* 규칙이 막아도 읽기에는 지장 없음 */ }
  },
  watchReaders(cb){
    if(this.mode!=='cloud'){ cb([]); return; }
    this.db.collection('novel_readers').onSnapshot(
      snap=> cb(snap.docs.map(d=>Object.assign({id:d.id}, d.data()))), ()=>cb([]));
  },
  async setBan(did, on){
    await this.db.collection('novel_readers').doc(did).set({banned:!!on}, {merge:true});
  },
  watchBans(cb){
    if(this.mode!=='cloud'){ cb([]); return; }
    this.db.collection('novel_bans').onSnapshot(
      snap=> cb(snap.docs.map(d=>d.id)), ()=>cb([]));
  },
  async banName(name, on){
    const id = String(name).trim().slice(0,20).replace(/[\/\.#\[\]]/g,'_');
    if(!id) return;
    if(on) await this.db.collection('novel_bans').doc(id).set({name:String(name).trim(), at:now()});
    else   await this.db.collection('novel_bans').doc(id).delete();
  },

  watchComments(sid, eid, cb){
    if(this.mode!=='cloud'){
      const d=this._local(); const k=sid+'|'+eid;
      d.cmt=d.cmt||{}; this._cmtCb={k,cb};
      cb(Object.values(d.cmt[k]||{}));
      return;
    }
    if(this._cmtUnsub) this._cmtUnsub();
    this._cmtUnsub = this.db.collection('novel_series').doc(sid)
      .collection('episodes').doc(eid).collection('comments')
      .onSnapshot(snap=> cb(snap.docs.map(d=>Object.assign({id:d.id}, d.data()))), e=>{ console.error(e); cb([]); });
  },
  stopComments(){ if(this._cmtUnsub){ this._cmtUnsub(); this._cmtUnsub=null; } this._cmtCb=null; },
  async addComment(sid, eid, c){
    if(this.mode!=='cloud'){
      const d=this._local(); const k=sid+'|'+eid; d.cmt=d.cmt||{}; d.cmt[k]=d.cmt[k]||{};
      const id=uid(); d.cmt[k][id]=Object.assign({id}, c);
      if(d.eps[sid] && d.eps[sid][eid]) d.eps[sid][eid].cmtCount=Object.keys(d.cmt[k]).length;
      this._saveLocal(d);
      if(this._cmtCb && this._cmtCb.k===k) this._cmtCb.cb(Object.values(d.cmt[k]));
      this._pushEps(sid);
      return;
    }
    await this.db.collection('novel_series').doc(sid)
      .collection('episodes').doc(eid).collection('comments').add(c);
    this.bumpCmt(sid, eid, 1);
  },
  bumpCmt(sid, eid, d){
    if(this.mode!=='cloud') return;
    this.db.collection('novel_series').doc(sid).collection('episodes').doc(eid)
      .update({cmtCount: firebase.firestore.FieldValue.increment(d)}).catch(()=>{});
  },
  async delComment(sid, eid, cid){
    if(this.mode!=='cloud'){
      const d=this._local(); const k=sid+'|'+eid;
      if(d.cmt && d.cmt[k]) delete d.cmt[k][cid];
      if(d.eps[sid] && d.eps[sid][eid]) d.eps[sid][eid].cmtCount=Object.keys((d.cmt&&d.cmt[k])||{}).length;
      this._saveLocal(d);
      if(this._cmtCb && this._cmtCb.k===k) this._cmtCb.cb(Object.values((d.cmt&&d.cmt[k])||{}));
      this._pushEps(sid);
      return;
    }
    await this.db.collection('novel_series').doc(sid)
      .collection('episodes').doc(eid).collection('comments').doc(cid).delete();
    this.bumpCmt(sid, eid, -1);
  },

  watchConfig(cb){
    if(this.mode==='cloud'){
      this.db.collection('novel_config').doc('site')
        .onSnapshot(doc=> cb(doc.exists? doc.data() : null), e=>console.error(e));
    }else{
      this._cfgCb = cb;
      cb(LS.get('mg_config', null));
    }
  },
  async saveConfig(cfg){
    if(this.mode==='cloud') await this.db.collection('novel_config').doc('site').set(cfg,{merge:true});
    else { LS.set('mg_config', cfg); if(this._cfgCb) this._cfgCb(cfg); }
  },
  async toggleLike(sid, on){
    if(this.mode==='cloud'){
      this.db.collection('novel_series').doc(sid)
        .update({likes: firebase.firestore.FieldValue.increment(on?1:-1)}).catch(()=>{});
    }else{
      const d=this._local();
      if(d.series[sid]) d.series[sid].likes=Math.max(0,(d.series[sid].likes||0)+(on?1:-1));
      this._saveLocal(d); this._pushLocal();
    }
  }
};

const S = {
  series:[], eps:{}, cat:'전체', sort:'update', q:'',
  hero:0, heroTimer:null, reader:null, batch:[], cmtOnly:false, uiOn:true,
  cats: DEFAULT_CATS.slice(), siteName: DEFAULT_NAME,
  user:null, authors:[], authReady:false,
  conn:{ok:false, err:null, lastSync:0}, readers:[], bans:[]
};
const Me   = {
  get name(){ return LS.get('mg_me',''); }, set name(v){ LS.set('mg_me',v); },
  get did(){ let d=LS.get('mg_did',''); if(!d){ d=uid()+uid(); LS.set('mg_did',d); } return d; }
};
const Mark = {
  all(){ return LS.get('mg_marks', []); },
  find(sid,eid){ return this.all().find(m=>m.sid===sid && m.eid===eid) || null; },
  toggle(m){
    let l=this.all().filter(x=>!(x.sid===m.sid && x.eid===m.eid));
    const on = l.length===this.all().length;
    if(on) l.unshift(m);
    LS.set('mg_marks', l.slice(0,50));
    return on;
  },
  remove(sid,eid){ LS.set('mg_marks', this.all().filter(x=>!(x.sid===sid && x.eid===eid))); },
  pos(sid,eid,v){
    const k='mg_pos_'+sid+'_'+eid;
    if(v===undefined) return LS.get(k,0);
    LS.set(k,v);
  }
};
const Read = {
  key(sid){ return 'mg_read_'+sid; },
  list(sid){ return LS.get(this.key(sid), []); },
  mark(sid,eid){ const l=this.list(sid); if(!l.includes(eid)){ l.push(eid); LS.set(this.key(sid),l);} LS.set('mg_last_'+sid, eid); },
  last(sid){ return LS.get('mg_last_'+sid, null); },
  recent(){ return LS.get('mg_recent',[]); },
  pushRecent(sid){ let r=LS.get('mg_recent',[]).filter(x=>x!==sid); r.unshift(sid); LS.set('mg_recent', r.slice(0,8)); },
  liked(sid){ return LS.get('mg_like',[]).includes(sid); },
  toggleLike(sid){ let l=LS.get('mg_like',[]); const on=!l.includes(sid); l = on? l.concat(sid) : l.filter(x=>x!==sid); LS.set('mg_like',l); return on; }
};

const BADGE_ICONS = ['','⭐','👑','🔥','🌙','✒️','📖','🎬','🍀','⚡','🐾','💎','🏆','🌸'];
const BADGES = {
  violet:['#5b4bff','#ffffff'], gold:['#e8a020','#ffffff'], green:['#0ca678','#ffffff'],
  blue:['#1c7ed6','#ffffff'], pink:['#d6336c','#ffffff'], gray:['#6b7280','#ffffff']
};
function isAdmin(){
  if(Store.mode!=='cloud') return true;
  const admin = String(window.ADMIN_EMAIL||'').trim().toLowerCase();
  return !!(S.user && admin && S.user.email===admin);
}
/* 지금 로그인한 사람의 작가 정보 */
function myRec(){
  if(!S.user) return null;
  return S.authors.find(a=>a.email===S.user.email) || null;
}
/* 사이트에 글을 쓸 수 있는 사람인가 */
function canWrite(){
  if(Store.mode!=='cloud') return true;
  return isAdmin() || !!myRec();
}
/* 이 분류에 글을 쓸 수 있는가 (담당 분류가 비어 있으면 전체 허용) */
function canWriteCat(cat){
  if(Store.mode!=='cloud' || isAdmin()) return true;
  const r=myRec(); if(!r) return false;
  const list=r.cats||[];
  return !list.length || list.includes(cat);
}
/* 이 작품을 고칠 수 있는가 */
function whyBlocked(s){
  if(Store.mode!=='cloud' || isAdmin() || !s) return '';
  const r=myRec();
  if(!r) return '작가로 등록되지 않은 계정입니다. 관리자에게 등록을 요청하세요.';
  if(!canWriteCat(s.category)) return `'${s.category||'분류 없음'}' 게시판 담당이 아닙니다. 관리자에게 담당 게시판 추가를 요청하세요.`;
  return `이 작품의 작가가 아닙니다. 관리자가 작품 수정에서 작가를 '${r.name||S.user.email}' 으로 바꿔 주면 쓸 수 있습니다.`;
}
function canEditSeries(s){
  if(Store.mode!=='cloud' || isAdmin()) return true;
  const r=myRec(); if(!r || !s) return false;
  const mine = (s.authorEmail && s.authorEmail===S.user.email)
            || (r.name && s.author===r.name);
  return (mine || r.editOthers===true) && canWriteCat(s.category);
}
/* 내가 쓸 수 있는 분류 목록 */
function myCats(){
  if(Store.mode!=='cloud' || isAdmin()) return S.cats.slice();
  const r=myRec(); const list=(r&&r.cats)||[];
  return list.length? S.cats.filter(c=>list.includes(c)) : S.cats.slice();
}
/* 작가 뱃지 */
function recOf(obj){
  if(!obj) return null;
  return S.authors.find(a=> (obj.authorEmail && a.email===obj.authorEmail))
      || S.authors.find(a=> a.name && a.name===obj.author) || null;
}
function badgeHTML(obj){
  const r=recOf(obj);
  if(!r || (!r.badge && !r.badgeIcon)) return '';
  const c=BADGES[r.badgeColor||'violet']||BADGES.violet;
  return `<span class="badge" style="background:${c[0]};color:${c[1]}">${r.badgeIcon? esc(r.badgeIcon)+(r.badge?' ':'') : ''}${esc(r.badge||'')}</span>`;
}
function badgePreview(icon, text, color){
  const c=BADGES[color||'violet']||BADGES.violet;
  if(!text && !icon) return '<span class="hint">뱃지 없음</span>';
  return `<span class="badge" style="background:${c[0]};color:${c[1]}">${icon? esc(icon)+(text?' ':'') : ''}${esc(text||'')}</span>`;
}

function gradOf(s){ const i = (typeof s.grad==='number')? s.grad : hashN(s.title||s.id, GRADS.length); return GRADS[i%GRADS.length]; }
function coverHTML(s, opt){
  opt = opt||{};
  if(s.cover) return `<img src="${s.cover}" alt="">`;
  const g = gradOf(s);
  return `<div class="cv-gen" style="background:linear-gradient(150deg,${g[0]},${g[1]})">
    <b>${esc(s.title||'제목 없음')}</b><span>${esc(s.author||'')}</span></div>`;
}
function cardHTML(s){
  const upd = s.lastEpAt||s.updatedAt||s.createdAt;
  return `<div class="card" data-go="#/series/${s.id}">
    <div class="card-cv">${coverHTML(s)}
      <span class="cv-tag">${esc(s.category||'미분류')}</span>
      ${isNew(upd)?'<span class="cv-up">UP</span>':''}
    </div>
    <div class="card-tt">${esc(s.title||'제목 없음')}</div>
    <div class="card-mt"><span>${badgeHTML(s)}${esc(s.author||'익명')}</span><span>·</span><span>${s.epCount||0}화</span></div>
    <div class="card-mt"><span>조회 ${nf(s.views)}</span><span>·</span><span>${ago(upd)}</span></div>
  </div>`;
}

/* ══════════════════════════════════════════════════
   5. 정렬·필터
   ══════════════════════════════════════════════════ */
function filtered(){
  let arr = S.series.slice();
  if(S.cat!=='전체') arr = arr.filter(s=>(s.category||'미분류')===S.cat);
  if(S.q){
    const q=S.q.toLowerCase();
    arr = arr.filter(s=> (s.title||'').toLowerCase().includes(q)
      || (s.author||'').toLowerCase().includes(q)
      || (s.summary||'').toLowerCase().includes(q)
      || (s.tags||[]).join(' ').toLowerCase().includes(q));
  }
  const by = {
    update:(a,b)=>(b.lastEpAt||b.updatedAt||0)-(a.lastEpAt||a.updatedAt||0),
    views :(a,b)=>(b.views||0)-(a.views||0),
    likes :(a,b)=>(b.likes||0)-(a.likes||0),
    eps   :(a,b)=>(b.epCount||0)-(a.epCount||0),
    title :(a,b)=>String(a.title||'').localeCompare(String(b.title||''),'ko')
  }[S.sort] || ((a,b)=>0);
  return arr.sort(by);
}
function popular(n){
  return S.series.slice().sort((a,b)=>
    ((b.views||0)*3+(b.likes||0)*10+(b.epCount||0)*2) - ((a.views||0)*3+(a.likes||0)*10+(a.epCount||0)*2)
  ).slice(0,n||10);
}

const RD = {
  get(){ return LS.get('mg_rd', {fs:17, lh:20, font:'serif', w:720}); },
  set(v){ LS.set('mg_rd', v); apply(); }
};
function apply(){
  const c=RD.get(), r=document.documentElement;
  r.style.setProperty('--rd-fs', c.fs+'px');
  r.style.setProperty('--rd-lh', (c.lh/10));
  r.style.setProperty('--rd-w', c.w+'px');
  const b=$('#rdBody'); if(b) b.classList.toggle('serif', c.font==='serif');
  const fv=$('#fsVal'), lv=$('#lhVal');
  if(fv) fv.textContent=c.fs+'px';
  if(lv) lv.textContent=(c.lh/10).toFixed(1);
  $$('#fontSeg button').forEach(x=>x.classList.toggle('on', x.dataset.v===c.font));
  $$('#widthSeg button').forEach(x=>x.classList.toggle('on', +x.dataset.v===c.w));
  const fr=$('#fsRange'), lr=$('#lhRange');
  if(fr) fr.value=c.fs; if(lr) lr.value=c.lh;
}

async function openReader(sid, eid){

  const idx = eps.findIndex(e=>e.id===eid);
  if(idx<0){ toast('회차를 찾을 수 없습니다'); return; }
  const e = eps[idx], s = S.series.find(x=>x.id===sid)||{};
  S.reader = {sid, eid, idx, eps};
  $('#rdTop').textContent = (s.title||'') + ' · ' + (e.no||'')+'화';
  $('#rdWrap').innerHTML = `
    <div class="rd-ep-no">${esc(s.title||'')} · ${e.no||''}화</div>

    <div class="rd-body" id="rdBody">${esc(e.body||'')}</div>
    ${e.note? `<section class="note">
      <div class="note-hd">${badgeHTML(e)}<b>${esc(e.author||'작가')}</b>의 말</div>
      <div class="note-bd">${esc(e.note)}</div>
    </section>`:''}
    <section class="cmt">

        <button class="btn btn-soft" id="cmtOnly" style="float:right;padding:6px 12px;font-size:12.5px">본문 숨기기</button>
      </h3>
      <div class="cmt-write">
        <textarea id="cmtBody" rows="2" placeholder="${Me.name? esc(Me.name)+'(으)로 댓글을 남깁니다' : '먼저 이름을 정해 주세요'}" maxlength="1000"></textarea>
        <button class="btn btn-pri" id="cmtGo">등록</button>
      </div>
      <div id="cmtList"><div class="hint">불러오는 중…</div></div>
    </section>`;
  apply();
  $('#reader').classList.add('on');
  $('#rdProg').style.display='block';
  document.body.style.overflow='hidden';
  const saved = Mark.pos(sid, eid);
  $('#reader').scrollTop = 0;
  if(saved>0.02){
    setTimeout(()=>{
      const el=$('#reader');
      el.scrollTop = saved*(el.scrollHeight-el.clientHeight);
      toast('읽던 곳에서 이어 봅니다');
    }, 60);
  }
  renderMarkBtn();
  setupComments(sid, eid);
  applyCmtOnly();
  S.uiOn = true; applyUI();
  if(S.cmtOnly) setTimeout(()=>{ const c=$('.cmt'); if(c) c.scrollIntoView({block:'start'}); }, 80);
  Read.mark(sid, eid);
  Store.bumpView(sid, eid);
  const prev = ()=> idx>0 && goRead(sid, eps[idx-1].id);
  const next = ()=> idx<eps.length-1 && goRead(sid, eps[idx+1].id);
  const list = ()=>{ location.hash='#/series/'+sid; };
  $('#fPrev').onclick=prev;  $('#fNext').onclick=next;  $('#fList').onclick=list;
  $('#fPrev').disabled = idx<=0;
  $('#fNext').disabled = idx>=eps.length-1;
  const bodyEl=$('#rdBody');
  if(bodyEl) bodyEl.onclick = ev=>{
    if(window.getSelection && String(window.getSelection())) return;
    if(ev.target.closest('button,a,input,textarea')) return;
    toggleUI();
  };
}
function hideReader(){
  if(!S.reader) return;
  Store.stopComments();
  $('#reader').classList.remove('on');
  $('#rdSet').classList.remove('on');
  $('#rdProg').style.display='none';
  document.body.style.overflow='';
  const sid=S.reader.sid;
  S.reader=null;
  renderEpList(sid);
}
function closeReader(){
  const sid = S.reader? S.reader.sid : null;
  if(history.length>1) history.back();
  else location.hash = sid? '#/series/'+sid : '#/';
}
/* 댓글 */
function applyUI(){
  const r=$('#reader'); if(!r) return;
  r.classList.toggle('ui-off', !S.uiOn);
}
function toggleUI(){ S.uiOn = !S.uiOn; applyUI(); }
function applyCmtOnly(){
  const r=$('#reader'); if(!r) return;
  r.classList.toggle('cmt-only', !!S.cmtOnly);
  const b=$('#cmtOnly'); if(b) b.textContent = S.cmtOnly? '본문 보기' : '본문 숨기기';
}
function canDelComment(c, sid){
  if(isAdmin() || Store.mode!=='cloud') return true;
  const ss = S.series.find(x=>x.id===sid);
  if(ss && canEditSeries(ss)) return true;
  if(S.user && c.uid && c.uid===S.user.email) return true;
  return c.did===Me.did && (now()-(c.at||0) < 5*60*1000);
}
function renderComments(sid, eid, list){
  const box=$('#cmtList'); if(!box) return;
  const arr = list.slice().sort((a,b)=>(a.at||0)-(b.at||0));
  const cnt=$('#cmtCnt'); if(cnt) cnt.textContent = arr.length;
  if(!arr.length){ box.innerHTML = '<div class="hint" style="padding:14px 0">첫 댓글을 남겨 보세요.</div>'; return; }
  box.innerHTML = arr.map(c=>`
    <div class="cmt-row">
      <div class="cmt-hd">
        <b>${badgeHTML({author:c.name, authorEmail:c.uid})}${esc(c.name||'익명')}</b>
        <span>${ago(c.at)}</span>
        ${canDelComment(c,sid)? `<button data-cdel="${esc(c.id)}" title="삭제">✕</button>`:''}
      </div>
      <div class="cmt-bd">${esc(c.body||'')}</div>
    </div>`).join('');
  $$('#cmtList [data-cdel]').forEach(b=> b.onclick=async ()=>{
    if(!confirm('이 댓글을 지울까요?')) return;
    try{ await Store.delComment(sid, eid, b.dataset.cdel); toast('지웠습니다'); }
    catch(e){ console.error(e); toast('지우지 못했습니다. 시간이 지난 댓글은 관리자만 지울 수 있습니다.'); }
  });
}
function setupComments(sid, eid){
  Store.watchComments(sid, eid, list=>{
    if(!S.reader || S.reader.sid!==sid || S.reader.eid!==eid) return;
    renderComments(sid, eid, list);
  });
  const go=$('#cmtGo'), ta=$('#cmtBody');
  if(!go) return;
  go.onclick = async ()=>{
    if(!Me.name){ showGate(true); return; }
    const body=ta.value.trim();
    if(!body){ toast('내용을 입력해 주세요'); return; }
    go.disabled=true;
    try{
      await Store.addComment(sid, eid, {
        name: Me.name.slice(0,20), did: Me.did, body: body.slice(0,1000),
        at: now(), uid: S.user? S.user.email : ''
      });
      ta.value=''; toast('댓글을 남겼습니다');
    }catch(e){ console.error(e); toast('댓글을 남기지 못했습니다'); }
    go.disabled=false;
  };
  ta.onkeydown = e=>{ if((e.metaKey||e.ctrlKey) && e.key==='Enter') go.click(); };
  const only=$('#cmtOnly');
  if(only) only.onclick = ()=>{ S.cmtOnly=!S.cmtOnly; applyCmtOnly(); if(S.cmtOnly){ const c=$('.cmt'); if(c) c.scrollIntoView({block:'start'}); } };
}

/* 책갈피 버튼 */
function renderMarkBtn(){
  const b=$('#rdMarkBtn'); if(!b || !S.reader) return;
  const on = !!Mark.find(S.reader.sid, S.reader.eid);
  b.classList.toggle('on', on);
  b.title = on? '책갈피 빼기' : '책갈피 꽂기';
}
function toggleMark(){
  if(!S.reader) return;
  const {sid,eid} = S.reader;
  const e = (S.eps[sid]||[]).find(x=>x.id===eid) || {};
  const ss = S.series.find(x=>x.id===sid) || {};
  const el = $('#reader');
  const pos = el.scrollHeight>el.clientHeight ? el.scrollTop/(el.scrollHeight-el.clientHeight) : 0;
  const on = Mark.toggle({sid, eid, no:e.no||0, title:e.title||'', series:ss.title||'', pos, at:now()});
  renderMarkBtn();
  setupComments(sid, eid);
  applyCmtOnly();
  S.uiOn = true; applyUI();
  if(S.cmtOnly) setTimeout(()=>{ const c=$('.cmt'); if(c) c.scrollIntoView({block:'start'}); }, 80);
  toast(on? '책갈피를 꽂았습니다' : '책갈피를 뺐습니다');
  if(location.hash==='#/'||location.hash==='') viewHome();
}

function catOptions(cur){
  const list = myCats();
  if(cur && !list.includes(cur)) list.unshift(cur);
  return list.map(c=>`<option ${cur===c?'selected':''}>${esc(c)}</option>`).join('');
}

/* 사이트 이름·분류 메뉴 편집 */
function openConfigModal(){
  let name = S.siteName;
  const rows = () => S.cats.map((c,i)=>`
    <div class="cat-row">
      <input class="inp" data-ci="${i}" value="${esc(c)}">
      <button data-up="${i}" title="위로">↑</button>
      <button data-down="${i}" title="아래로">↓</button>
      <button data-rm="${i}" title="삭제">✕</button>
    </div>`).join('');
  const draw = ()=>{
    $('#modal').innerHTML = `
    <div class="modal-hd"><h3>사이트 설정</h3>
      <button class="icobtn" style="margin-left:auto" data-close>✕</button></div>
    <div class="modal-bd">
      <div class="f"><label>사이트 이름</label>
        <input class="inp" id="cName" value="${esc(name)}" placeholder="사내문고"></div>
      <div class="f"><label>상단 메뉴(분류)</label>
        <div id="catRows">${rows()}</div>
        <button class="btn btn-soft" id="cAdd" style="margin-top:4px">＋ 분류 추가</button>
        <div class="hint">이름을 바꾸면 그 분류에 속한 작품들도 함께 옮겨집니다. 분류를 지워도 작품은 지워지지 않고 '전체'에서 계속 보입니다.</div>
      </div>
    </div>
    <div class="modal-ft">
      <button class="btn btn-line" data-close>취소</button>
      <button class="btn btn-pri" id="cSave">저장</button>
    </div>`;
    const read = ()=> $$('#catRows input').map(i=>i.value);
    $('#cName').oninput = e=>{ name = e.target.value; };
    $('#cAdd').onclick = ()=>{ S.cats = read().concat('새 분류'); draw(); };
    $$('#catRows [data-rm]').forEach(b=> b.onclick=()=>{ const a=read(); a.splice(+b.dataset.rm,1); S.cats=a; draw(); });
    $$('#catRows [data-up]').forEach(b=> b.onclick=()=>{ const a=read(); const i=+b.dataset.up; if(i>0){ [a[i-1],a[i]]=[a[i],a[i-1]]; } S.cats=a; draw(); });
    $$('#catRows [data-down]').forEach(b=> b.onclick=()=>{ const a=read(); const i=+b.dataset.down; if(i<a.length-1){ [a[i+1],a[i]]=[a[i],a[i+1]]; } S.cats=a; draw(); });
    $('#cSave').onclick = async ()=>{
      const before = S.cats.slice();
      const after = read().map(x=>x.trim()).filter(Boolean);
      if(!after.length){ toast('분류를 하나 이상 남겨 주세요'); return; }
      const renames = [];
      before.forEach((b,i)=>{ const a=after[i]; if(a && a!==b) renames.push([b,a]); });
      S.cats = after;
      S.siteName = ($('#cName').value||name).trim()||DEFAULT_NAME;
      await Store.saveConfig({cats:after, siteName:S.siteName});
      for(const [from,to] of renames){
        const hit = S.series.filter(x=>x.category===from);
        for(const x of hit) await Store.saveSeries({id:x.id, category:to});
      }
      applyConfig(); closeModal(); toast('설정을 저장했습니다');
      route();
    };
  };
  draw();
  $('#ovl').classList.add('on'); markModalOpen();
}

/* 연결 상태 */
const ONLINE_MS = 3*60*1000;
function isOnline(r){ return r.lastSeen && (now()-r.lastSeen) < ONLINE_MS; }
function myReader(){ return S.readers.find(r=>r.id===Me.did) || null; }
function amBanned(){
  if(Store.mode!=='cloud' || S.user) return false;
  const r=myReader();
  const nameId = String(Me.name||'').trim().slice(0,20).replace(/[\/\.#\[\]]/g,'_');
  return !!(r && r.banned) || (!!nameId && S.bans.includes(nameId));
}
function enforceBan(){
  if(!amBanned()) return false;
  const g=$('#gate');
  if(!g.classList.contains('on')){
    Me.name='';
    showGate(true);
  }
  const p=$('#gate .gate-card p');
  if(p) p.innerHTML = '<b style="color:var(--danger)">이 이름은 현재 이용이 제한되어 있습니다.</b><br>관리자에게 문의해 주세요.';
  return true;
}
function showGate(force){
  const g=$('#gate');
  $('#gateTitle').textContent = S.siteName;
  if(!force && Me.name){ g.classList.remove('on'); document.body.style.overflow=''; return; }
  g.classList.add('on');
  document.body.style.overflow='hidden';
  const inp=$('#gateName');
  inp.value = Me.name||'';
  setTimeout(()=>inp.focus(), 80);
}
function enterSite(){
  const n=$('#gateName').value.trim();
  if(!n){ $('#gateName').focus(); toast('이름을 입력해 주세요'); return; }
  const nameId = n.slice(0,20).replace(/[\/\.#\[\]]/g,'_');
  const mine = myReader();
  if(S.bans.includes(nameId) || (mine && mine.banned)){
    toast('이 이름은 현재 이용이 제한되어 있습니다'); return;
  }
  Me.name=n;
  Store.touchReader(n);
  $('#gate').classList.remove('on');
  document.body.style.overflow='';
  renderWho();
  toast(n+'님, 어서 오세요');
}

function resizeImage(file, mw, mh){
  return new Promise((res,rej)=>{
    const fr=new FileReader();
    fr.onload=()=>{
      const img=new Image();
      img.onload=()=>{
        const c=document.createElement('canvas');
        const ratio=Math.max(mw/img.width, mh/img.height);
        c.width=mw; c.height=mh;
        const w=img.width*ratio, h=img.height*ratio;
        const ctx=c.getContext('2d');
        ctx.drawImage(img, (mw-w)/2, (mh-h)/2, w, h);
        res(c.toDataURL('image/jpeg', .82));
      };
      img.onerror=rej; img.src=fr.result;
    };
    fr.onerror=rej; fr.readAsDataURL(file);
  });
}

/* txt 파일 파싱 */
function parseTxt(name, text){
  text = text.replace(/\r\n/g,'\n').replace(/^﻿/,'');
  let title = name.replace(/\.(txt|md)$/i,'').trim();
  const lines = text.split('\n');
  let body = text;
  const first = (lines[0]||'').trim();
  if(first && first.length<=40 && (lines[1]||'').trim()===''){
    title = first.replace(/^#\s*/,''); body = lines.slice(2).join('\n');
  }
  const m = name.match(/(\d+)/);
  return {title, body: body.trim(), no: m? +m[1] : null};
}
function handleFiles(files){
  const arr = Array.from(files).filter(f=>/\.(txt|md)$/i.test(f.name)||f.type==='text/plain');
  if(!arr.length){ toast('.txt 파일만 올릴 수 있습니다'); return; }
  arr.sort((a,b)=>a.name.localeCompare(b.name,'ko',{numeric:true}));
  S.batch=[];
  let done=0;
  arr.forEach((f,i)=>{
    const fr=new FileReader();
    fr.onload=()=>{
      const p=parseTxt(f.name, fr.result);
      S.batch[i]=Object.assign(p,{size:f.size});
      if(++done===arr.length) renderBatch();
    };
    fr.readAsText(f, 'utf-8');
  });
}
function renderBatch(){
  const box=$('#batchBox'); if(!box) return;
  if(!S.batch.length){ box.innerHTML=''; return; }
  if(S.batch.length===1){
    const b=S.batch[0];
    $('#wTitle').value=b.title; $('#wBody').value=b.body;
    $('#wBody').dispatchEvent(new Event('input'));
    box.innerHTML=`<div class="hint" style="margin-top:10px">'${esc(b.title)}' 내용을 아래에 불러왔습니다. 확인 후 등록하세요.</div>`;
    S.batch=[]; return;
  }
  box.innerHTML=`<div class="batch">
    <div style="font-weight:700;font-size:13.5px;margin-bottom:6px">${S.batch.length}개 파일 · 회차 일괄 등록</div>
    ${S.batch.map((b,i)=>`<div class="batch-row">
      <span class="nm">${esc(b.title)}</span>
      <span class="sz">${nf(b.body.length)}자</span>
      <button class="icobtn" data-bdel="${i}" style="width:26px;height:26px">✕</button>
    </div>`).join('')}
    <div style="display:flex;gap:8px;margin-top:10px">
      <button class="btn btn-pri" id="bGo">${S.batch.length}개 회차 등록</button>
      <button class="btn btn-soft" id="bCancel">취소</button>
    </div></div>`;
  $$('#batchBox [data-bdel]').forEach(b=>b.onclick=()=>{ S.batch.splice(+b.dataset.bdel,1); renderBatch(); });
  $('#bCancel').onclick=()=>{ S.batch=[]; renderBatch(); };
  $('#bGo').onclick=async ()=>{
    const sid=$('#wSeries').value;
    const eps = S.eps[sid] || await Store.getEpisodes(sid);
    let maxNo = eps.reduce((m,e)=>Math.max(m, e.no||0), 0);
    const author=$('#wAuthor').value.trim()||Me.name||'익명';
    $('#bGo').disabled=true; $('#bGo').textContent='등록 중…';
    for(const b of S.batch){
      maxNo += 1;
      await Store.saveEpisode(sid, {no: b.no||maxNo, title:b.title, body:b.body, author,
        authorEmail:(S.user? S.user.email : ''), views:0});
    }
    S.batch=[]; toast('일괄 등록을 마쳤습니다'); location.hash='#/series/'+sid;
  };
}

function escapeKakao(){
  const ua = navigator.userAgent || '';
  if(!/KAKAOTALK/i.test(ua)) return;
  const url = location.href;
  const bar = document.createElement('div');
  bar.className='kakao';

  document.body.insertBefore(bar, document.body.firstChild);
  const open = ()=>{
    if(/android/i.test(ua)){
      location.href = 'intent://' + url.replace(/^https?:\/\//,'')
        + '#Intent;scheme=' + (location.protocol==='https:'?'https':'http') + ';package=com.android.chrome;end';
    }else{
      location.href = 'kakaotalk://web/openExternal?url=' + encodeURIComponent(url);
    }
  };
  $('#kkGo').onclick = open;
  setTimeout(open, 400);   // 자동으로 한 번 시도
}

  if(Store.mode==='local') seedDemo();
  modeBar();
  Store.initAuth(u=>{
    S.user=u; S.authReady=true;
    if(u && !Me.name) Me.name=u.name;
    if(u){ $('#gate').classList.remove('on'); document.body.style.overflow=''; }
    applyPerm(); route();
  });
  Store.watchAuthors(list=>{ S.authors=list; applyPerm(); if(S._authorsDraw) S._authorsDraw(); });
  Store.watchReaders(list=>{
    S.readers=list;
    if(S._readersDraw) S._readersDraw();
    enforceBan();
  });
  Store.watchBans(list=>{ S.bans=list; if(S._readersDraw) S._readersDraw(); enforceBan(); });
  setInterval(()=>{ if(Me.name && !amBanned()) Store.touchReader(Me.name); }, 60000);
  Store.watchConfig(cfg=>{
    if(cfg){
      if(Array.isArray(cfg.cats) && cfg.cats.length) S.cats = cfg.cats;
      if(cfg.siteName) S.siteName = cfg.siteName;
    }
    applyConfig();
  });
  Store.onSeries(list=>{
    S.series = list;
    const h=location.hash||'#/';
    if(h==='#/'||h==='') viewHome();
    else if(h.indexOf('#/series/')===0){ const id=h.slice(9).split('?')[0]; if(!$('#epList')) viewSeries(id); }
  });
  applyPerm();
  route();
  showGate(false);
}
boot();
})();
</script>
</body>
</html>
